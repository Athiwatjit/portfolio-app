<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>พอร์ตหุ้นของฉัน</title>
<meta name="theme-color" content="#1f5f52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style id="css">
/* Layout: one column ledger — P/L verdict, holdings, entry form, account book, monthly summary. */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f6f4; --surface:#ffffff; --ink:#17201c; --muted:#5d6a63; --line:#dfe3df;
  --accent:#1f5f52; --accent-soft:#e3efeb;
  --gain:#16834a; --gain-soft:#e2f3e8; --loss:#c62f2f; --loss-soft:#fbe6e4;
  --cost:#9aa59f; --warn:#a86a00;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#161d1a; --ink:#e6ece8; --muted:#94a29b; --line:#27312c;
  --accent:#6cc3ad; --accent-soft:#1b2d28; --gain:#4cc985; --gain-soft:#14281d; --loss:#ff7a70; --loss-soft:#2e1817;
  --cost:#56625c; --warn:#e0a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#161d1a; --ink:#e6ece8; --muted:#94a29b; --line:#27312c;
  --accent:#6cc3ad; --accent-soft:#1b2d28; --gain:#4cc985; --gain-soft:#14281d; --loss:#ff7a70; --loss-soft:#2e1817;
  --cost:#56625c; --warn:#e0a640; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
h1,h2,h3{font-weight:700;text-wrap:balance;margin:0}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.1rem}
h3{font-size:.95rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.gain{color:var(--gain)} .loss{color:var(--loss)}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.top .meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
label.inline{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input.num{text-align:right}
button{font:inherit;cursor:pointer;border-radius:6px;padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
button.primary[disabled]{opacity:.45;cursor:default}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.ghost:hover{color:var(--loss)}

/* verdict */
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.verdict .big{font-size:2.2rem;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.pill{display:inline-block;font-family:var(--f-num);font-weight:600;padding:2px 10px;border-radius:999px;font-size:.95rem;margin-left:8px;vertical-align:middle}
.pill.gain{background:var(--gain-soft)} .pill.loss{background:var(--loss-soft)}
.split{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;align-content:start}
.kpi .k{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-family:var(--f-num);font-size:1.05rem;font-weight:500}
.meter{margin-top:16px}
.meter .track{position:relative;height:14px;background:var(--line);border-radius:4px;overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:4px}
.meter .legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:6px;font-size:.8rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 12px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.76rem;font-weight:500;color:var(--muted);letter-spacing:.02em}
th.l,td.l{text-align:left}
td input{width:100%;max-width:110px}
tfoot td{font-weight:600;border-bottom:none;border-top:2px solid var(--ink)}
.chip{font-size:.74rem;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.sell{background:var(--gain-soft);color:var(--gain)}
.chip.div{background:var(--accent-soft);color:var(--warn)}
.chip.cashmv{background:var(--line);color:var(--muted)}
.chip.open{background:var(--line);color:var(--ink)}
.symc{font-family:var(--f-num);font-weight:600}
.note{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.85rem}
tr.err td{background:var(--loss-soft)}

/* bars */
.bars{display:grid;gap:14px;margin-top:6px}
.barrow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center}
.pair{display:grid;gap:3px}
.bar{height:12px;border-radius:3px;min-width:2px}
.bar.cost{background:var(--cost)}
.bar.val.gain{background:var(--gain)} .bar.val.loss{background:var(--loss)}
.bar-label{font-size:.78rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.alloc{display:flex;height:22px;border-radius:4px;overflow:hidden;margin-top:6px;gap:2px}
.alloc div{display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:.72rem;color:var(--bg);font-weight:600;min-width:0;overflow:hidden}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:.82rem}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}

/* form */
form.trade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
form.trade label{display:grid;gap:4px;font-size:.78rem;color:var(--muted)}
form.trade .wide{grid-column:span 2}
.preview{font-size:.85rem;color:var(--muted);min-height:1.4em;margin:8px 0 0}
.notice{font-size:.85rem;padding:8px 12px;border-radius:6px;background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:var(--loss-soft)}

/* monthly chart */
.mchart{display:flex;align-items:stretch;gap:6px;height:150px;padding:4px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.mcol{flex:1 0 34px;display:grid;grid-template-rows:1fr 1fr auto;min-width:34px}
.mcol .up,.mcol .down{display:flex;justify-content:center}
.mcol .up{align-items:flex-end;border-bottom:1px solid var(--muted)}
.mcol .down{align-items:flex-start}
.mcol .b{width:60%;border-radius:2px;min-height:1px}
.mcol .lbl{font-size:.68rem;color:var(--muted);text-align:center;font-family:var(--f-num);padding-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .k{font-size:.76rem;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:1.05rem}

details.opening summary{cursor:pointer;font-weight:600}
details.opening .grid{display:grid;gap:8px;margin-top:10px}

.savebar{position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.savebar .inner{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.btnlike{display:inline-flex;align-items:center;cursor:pointer;border-radius:6px;padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btnlike:focus-within{outline:2px solid var(--accent)}
.empty{padding:14px 0;color:var(--muted);font-size:.9rem}
.foot{font-size:.8rem;color:var(--muted)}

@media (max-width:760px){
  .verdict,.two{grid-template-columns:1fr}
  form.trade{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .verdict .big{font-size:1.8rem}
}
@media (prefers-reduced-motion:no-preference){.meter .fill,.bar{transition:width .3s ease}}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script type="application/json" id="state">{"v": 2, "updated": "", "feePct": 0.168, "opening": {"date": "2026-11-01", "cash": 0, "holdings": []}, "prices": {}, "entries": []}</script>
<script id="main">
(function(){
function migrate(s){
  if(s && s.v===2) return s;
  // v1: holdings snapshot + trades
  const out={v:2,updated:s.updated||'',feePct:s.feePct||0.168,opening:{date:s.updated||'',cash:s.cash||0,holdings:[]},prices:{},entries:[]};
  (s.holdings||[]).forEach(h=>{ out.opening.holdings.push({sym:h.sym,qty:h.qty,avg:h.avg}); out.prices[h.sym]=h.price; });
  return out;
}
const SRC_STATE = migrate(JSON.parse(document.getElementById('state').textContent));
let S = JSON.parse(JSON.stringify(SRC_STATE));
let msg = '', msgErr=false;
const LS = 'port-app-v1'; let undoState=null;
try{ const d = JSON.parse(localStorage.getItem(LS)||'null'); if(d && d.v===2){ S = d; } }catch(e){}
let storageOk=true;

const TYPES = {buy:'ซื้อ',sell:'ขาย',div:'ปันผล',dep:'ฝากเงิน',wd:'ถอนเงิน'};
const COLORS = ['var(--accent)','#b5832a','#5a6fb8','#a24d86','#3f8f9c','#7a7f2e'];
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const fmt = (n,d=2)=> (isFinite(n)?n:0).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn = n => n>0.004?'+':'';
const cls = n => n>0.004?'gain':(n<-0.004?'loss':'');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const thDate = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return `${+dd} ${TH_M[+m-1]} ${String(+y+543).slice(2)}`; };
const thMonth = ym => { const [y,m]=ym.split('-'); return `${TH_M[+m-1]} ${String(+y+543).slice(2)}`; };
const r2 = n => Math.round(n*100)/100;
const today = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };

/* Replay the account: opening balance, then every entry in date order. */
function replay(entries){
  const pos = {}; let cash = +S.opening.cash||0;
  S.opening.holdings.forEach(h=>{ if(h.sym) pos[h.sym]={qty:+h.qty||0,avg:+h.avg||0}; });
  const sorted = entries.map((e,i)=>({...e,_i:i})).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:a._i-b._i);
  let cum=0, fees=0, divs=0, deposits=0, withdrawals=0;
  const rows=[];
  for(const e of sorted){
    const r={...e,pl:0,err:''};
    if(e.type==='buy'){
      const gross=e.qty*e.price, total=gross+e.fee;
      const p=pos[e.sym]||(pos[e.sym]={qty:0,avg:0});
      p.avg=(p.qty*p.avg+total)/(p.qty+e.qty); p.qty+=e.qty;
      cash-=total; fees+=e.fee; r.amount=-total;
    } else if(e.type==='sell'){
      const p=pos[e.sym];
      if(!p||p.qty+1e-9<e.qty){ r.err=`ขายเกินจำนวนที่มี (${p?fmt(p.qty,0):0} หุ้น)`; r.amount=0; }
      else{
        const net=e.qty*e.price-e.fee;
        r.pl=net-e.qty*p.avg; r.avgAt=p.avg;
        p.qty-=e.qty; if(p.qty<1e-9){ p.qty=0; }
        cash+=net; fees+=e.fee; cum+=r.pl; r.amount=net;
      }
    } else if(e.type==='div'){ cash+=e.amount; r.pl=e.amount; cum+=e.amount; divs+=e.amount; r.amount=e.amount; }
    else if(e.type==='dep'){ cash+=e.amount; deposits+=e.amount; r.amount=e.amount; }
    else if(e.type==='wd'){ cash-=e.amount; withdrawals+=e.amount; r.amount=-e.amount; }
    r.cum=cum; r.cash=cash; rows.push(r);
  }
  const holdings = Object.entries(pos).filter(([,p])=>p.qty>0).map(([sym,p])=>{
    const price = S.prices[sym]!=null ? +S.prices[sym] : p.avg;
    const cost=p.qty*p.avg, value=p.qty*price, pl=value-cost;
    return {sym,qty:p.qty,avg:p.avg,price,cost,value,pl,pct:cost?pl/cost*100:0};
  });
  const realizedTrades = rows.filter(r=>r.type==='sell'&&!r.err).reduce((a,r)=>a+r.pl,0);
  return {rows,holdings,cash,cum,fees,divs,deposits,withdrawals,realizedTrades};
}

function monthly(rows){
  const m={};
  rows.forEach(r=>{ if(r.err) return; const k=r.date.slice(0,7); const o=m[k]||(m[k]={buy:0,sell:0,div:0,fee:0,pl:0,n:0});
    if(r.type==='buy'){o.buy+=-r.amount;o.fee+=r.fee;o.n++;}
    if(r.type==='sell'){o.sell+=r.amount;o.fee+=r.fee;o.pl+=r.pl;o.n++;}
    if(r.type==='div'){o.div+=r.amount;o.pl+=r.amount;}
  });
  let cum=0; return Object.keys(m).sort().map(k=>{cum+=m[k].pl; return {month:k,...m[k],cum};});
}

function stats(rows){
  const sells=rows.filter(r=>r.type==='sell'&&!r.err);
  const wins=sells.filter(r=>r.pl>0), losses=sells.filter(r=>r.pl<=0);
  return {n:sells.length,wins:wins.length,losses:losses.length,
    rate: sells.length? wins.length/sells.length*100 : 0,
    avgWin: wins.length? wins.reduce((a,r)=>a+r.pl,0)/wins.length : 0,
    avgLoss: losses.length? losses.reduce((a,r)=>a+r.pl,0)/losses.length : 0};
}

function bySymbol(rows){
  const m={};
  rows.forEach(r=>{ if(r.err||!r.sym||!['sell','div'].includes(r.type)) return; const o=m[r.sym]||(m[r.sym]={sold:0,trade:0,div:0});
    if(r.type==='sell'){o.sold+=r.qty;o.trade+=r.pl;} else o.div+=r.pl; });
  return Object.entries(m).map(([sym,o])=>({sym,...o,total:o.trade+o.div})).sort((a,b)=>b.total-a.total);
}

function persistDraft(){ try{localStorage.setItem(LS,JSON.stringify(S)); storageOk=true;}catch(e){ storageOk=false; } }
function markDirty(){ persistDraft(); render(); }

function render(){
  const A = replay(S.entries);
  const hold = A.holdings;
  const cost=hold.reduce((a,r)=>a+r.cost,0), value=hold.reduce((a,r)=>a+r.value,0);
  const unreal=value-cost, upct=cost?unreal/cost*100:0;
  hold.forEach(r=>r.w=value?r.value/value*100:0);
  const net = unreal + A.cum;
  const total = value + A.cash;
  const recov = cost? Math.min(100, value/cost*100) : 0;
  const need = value? (cost/value-1)*100 : 0;
  const maxBar = Math.max(1,...hold.map(r=>Math.max(r.cost,r.value)));
  const M = monthly(A.rows), ST = stats(A.rows), BS = bySymbol(A.rows);
  const mMax = Math.max(1,...M.map(x=>Math.abs(x.pl)));
  const syms = [...new Set([...S.opening.holdings.map(h=>h.sym),...hold.map(h=>h.sym),...S.entries.map(e=>e.sym).filter(Boolean)])];

  const active = document.activeElement && document.activeElement.id;
  const openOpen = document.getElementById('opening') ? document.getElementById('opening').open : false;
  const formVals = {}; ['t-date','t-type','t-sym','t-qty','t-price','t-fee','t-amount','t-note'].forEach(id=>{const el=document.getElementById(id); if(el) formVals[id]=el.value;});

  document.getElementById('app').innerHTML = `
  <header class="top">
    <div><div class="muted small">พอร์ตหุ้นไทย · สมุดบัญชีและกำไร/ขาดทุน</div><h1>พอร์ตหุ้นของฉัน</h1></div>
    <div class="meta">
      <label class="inline" for="upd">ราคาหุ้น ณ วันที่ <input id="upd" type="date" value="${esc(S.updated)}"></label>
    </div>
  </header>

  ${(!S.opening.holdings.length && !S.entries.length)?`<p class="notice" style="margin:0">เริ่มใช้งาน: กด <b>กู้คืนจากไฟล์</b> ด้านล่างเพื่อโหลดข้อมูลพอร์ตของคุณ หรือเปิด <b>ยอดยกมา</b> แล้วใส่หุ้นที่ถืออยู่เอง</p>`:''}
  <section class="verdict" aria-label="สรุป">
    <div>
      <div class="muted small">กำไร/ขาดทุนสุทธิทั้งหมด (ยังไม่ขาย + ขายแล้ว + ปันผล)</div>
      <div class="big num ${cls(net)}">${sgn(net)}${fmt(net)} ฿</div>
      <div class="split">
        <span>ยังไม่ขาย <b class="num ${cls(unreal)}">${sgn(unreal)}${fmt(unreal)}</b> <span class="pill ${cls(unreal)}" style="font-size:.78rem;margin-left:2px">${sgn(upct)}${fmt(upct)}%</span></span>
        <span>ขายแล้ว <b class="num ${cls(A.realizedTrades)}">${sgn(A.realizedTrades)}${fmt(A.realizedTrades)}</b></span>
        <span>ปันผล <b class="num ${cls(A.divs)}">${sgn(A.divs)}${fmt(A.divs)}</b></span>
      </div>
      <div class="meter">
        <div class="track"><div class="fill" style="width:${recov}%"></div></div>
        <div class="legend"><span>หุ้นที่ถือมีมูลค่า ${fmt(recov,1)}% ของต้นทุน</span><span>${cost===0?'ไม่มีหุ้นถืออยู่':need>0?`ต้องขึ้นอีก <b class="num">${fmt(need,1)}%</b> ถึงจะเท่าทุน`:'เหนือทุนแล้ว'}</span></div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="k">ต้นทุนหุ้นที่ถือ</div><div class="v">${fmt(cost)}</div></div>
      <div class="kpi"><div class="k">มูลค่าตลาด</div><div class="v">${fmt(value)}</div></div>
      <div class="kpi"><div class="k">เงินสดคงเหลือ</div><div class="v ${A.cash<0?'loss':''}">${fmt(A.cash)}</div></div>
      <div class="kpi"><div class="k">มูลค่าบัญชีรวม</div><div class="v">${fmt(total)}</div></div>
      <div class="kpi"><div class="k">ค่าธรรมเนียมที่จ่ายไป</div><div class="v">${fmt(A.fees)}</div></div>
      <div class="kpi"><div class="k">ฝาก / ถอน สุทธิ</div><div class="v">${sgn(A.deposits-A.withdrawals)}${fmt(A.deposits-A.withdrawals)}</div></div>
    </div>
  </section>
  ${A.cash<0?`<p class="notice warn" style="margin:0">เงินสดติดลบ ${fmt(A.cash)} บาท ถ้าโอนเงินเข้าพอร์ตแล้ว ให้บันทึกรายการ "ฝากเงิน" ด้วย</p>`:''}

  <section class="card" aria-label="หุ้นที่ถือ">

function readForm(){
  const g=id=>document.getElementById(id);
  const type=g('t-type').value;
  const e={date:g('t-date').value,type,sym:'',qty:0,price:0,fee:0,amount:0,note:g('t-note').value.trim()};
  if(type==='buy'||type==='sell'){
    e.sym=g('t-sym').value.trim().toUpperCase(); e.qty=parseFloat(g('t-qty').value)||0; e.price=parseFloat(g('t-price').value)||0;
    const pct=parseFloat(g('t-fee').value)||0; e.fee=r2(e.qty*e.price*pct/100); e.feePct=pct;
  } else {
    if(type==='div') e.sym=g('t-sym').value.trim().toUpperCase();
    e.amount=parseFloat(g('t-amount').value)||0;
  }
  return e;
}
function syncForm(){
  const type=document.getElementById('t-type'); if(!type) return;
  const t=type.value;
  document.querySelectorAll('#tradeForm [data-for]').forEach(l=>{
    const f=l.dataset.for;
    l.hidden = !( (f==='trade'&&(t==='buy'||t==='sell')) || (f==='money'&&(t==='div'||t==='dep'||t==='wd')) || (f==='stock'&&(t==='buy'||t==='sell'||t==='div')) );
  });
  const p=document.getElementById('tpreview'); const e=readForm();
  if((t==='buy'||t==='sell') && e.qty>0 && e.price>0){
    const gross=e.qty*e.price;
    if(t==='buy') p.textContent=`มูลค่า ${fmt(gross)} + ค่าธรรมเนียม ${fmt(e.fee)} = จ่ายทั้งหมด ${fmt(gross+e.fee)} บาท`;
    else{
      const A=replay(S.entries); const h=A.holdings.find(x=>x.sym===e.sym);
      const net=gross-e.fee; const pl=h? net-e.qty*h.avg : null;
      p.textContent=`ได้รับ ${fmt(net)} บาท หลังหักค่าธรรมเนียม ${fmt(e.fee)}`+(pl!=null?` · คาดว่า${pl>=0?'กำไร':'ขาดทุน'} ${fmt(Math.abs(pl))} บาท (ทุนเฉลี่ย ${fmt(h.avg,4)})`:'');
    }
  } else p.textContent='';
}

document.addEventListener('input', e=>{ if(e.target.closest && e.target.closest('#tradeForm')) syncForm(); });
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='t-type'){ syncForm(); return; }
  if(t.closest && t.closest('#tradeForm')) return;
  if(t.dataset.price){ S.prices[t.dataset.price]=parseFloat(t.value)||0; markDirty(); }
  else if(t.dataset.op!==undefined){ const h=S.opening.holdings[+t.dataset.op]; const k=t.dataset.k; h[k]= k==='sym'?t.value.trim().toUpperCase():(parseFloat(t.value)||0); markDirty(); }
  else if(t.id==='op-cash'){ S.opening.cash=parseFloat(t.value)||0; markDirty(); }
  else if(t.id==='op-date'){ S.opening.date=t.value; markDirty(); }
  else if(t.id==='upd'){ S.updated=t.value; markDirty(); }
});

document.addEventListener('click', e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.del!==undefined){ const i=+t.dataset.del; const en=S.entries[i]; S.entries.splice(i,1); S.entries.splice(i,0,en); undoState=JSON.stringify(S); S.entries.splice(i,1); msg=`ลบรายการ ${TYPES[en.type]} ${en.sym||''} วันที่ ${thDate(en.date)} แล้ว`; msgErr=false; markDirty(); }
  else if(t.id==='undo'){ if(undoState){ S=JSON.parse(undoState); undoState=null; msg='เรียกรายการคืนแล้ว'; msgErr=false; markDirty(); } }
  else if(t.id==='bk-save'){ backupFile(); }
  else if(t.id==='bk-copy'){ const txt=JSON.stringify(S); const done=()=>{msg='คัดลอกข้อมูลแล้ว นำไปวางเก็บไว้ในโน้ตหรือแชทของตัวเองได้'; msgErr=false; render();}; (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(done).catch(()=>{ document.getElementById('bk-paste').hidden=false; const ta=document.getElementById('bk-text'); ta.value=txt; ta.select(); }); }
  else if(t.id==='bk-paste-toggle'){ const p=document.getElementById('bk-paste'); p.hidden=!p.hidden; }
  else if(t.id==='bk-import'){ stageImport(document.getElementById('bk-text').value); }
  else if(t.id==='bk-yes'){ if(pendingImport){ undoState=JSON.stringify(S); S=pendingImport; pendingImport=null; msg='กู้คืนข้อมูลแล้ว'; msgErr=false; markDirty(); } }
  else if(t.id==='bk-no'){ pendingImport=null; document.getElementById('bk-confirm').hidden=true; }
  else if(t.dataset.opdel!==undefined){ S.opening.holdings.splice(+t.dataset.opdel,1); markDirty(); }
  else if(t.id==='op-add'){ S.opening.holdings.push({sym:'',qty:0,avg:0}); markDirty(); }
});

document.addEventListener('submit', ev=>{
  if(ev.target.id!=='tradeForm') return;
  ev.preventDefault();
  const e=readForm(); msgErr=true;
  if(!e.date){ msg='ใส่วันที่ของรายการ'; return render(); }
  if(e.type==='buy'||e.type==='sell'){
    if(!e.sym||!(e.qty>0)||!(e.price>0)){ msg='กรอกชื่อหุ้น จำนวนหุ้น และราคาให้ครบ'; return render(); }
    if(e.date<S.opening.date){ msg='วันที่ต้องไม่ก่อนวันยอดยกมา'; return render(); }
  } else if(!(e.amount>0)){ msg='ใส่จำนวนเงิน'; return render(); }
  else if(e.type==='div' && !e.sym){ msg='ใส่ชื่อหุ้นที่จ่ายปันผล'; return render(); }
  if(e.feePct!=null){ S.feePct=e.feePct; delete e.feePct; }
  const trial=replay([...S.entries,e]); const bad=trial.rows.find(r=>r.err);
  if(bad){ msg=`บันทึกไม่ได้: ${bad.sym} ${bad.err}`; return render(); }
  S.entries.push(e);
  const row=trial.rows.find(r=>r._i===S.entries.length-1);
  msgErr=false;
  if(e.type==='buy'){ const h=trial.holdings.find(x=>x.sym===e.sym); msg=`บันทึกซื้อ ${e.sym} ${fmt(e.qty,0)} หุ้นแล้ว ต้นทุนเฉลี่ยใหม่ ${fmt(h?h.avg:0,4)} บาท`; if(S.prices[e.sym]==null) S.prices[e.sym]=e.price; }
  else if(e.type==='sell') msg=`บันทึกขาย ${e.sym} แล้ว ${row.pl>=0?'กำไร':'ขาดทุน'} ${fmt(Math.abs(row.pl))} บาท · กำไรสะสมตอนนี้ ${sgn(trial.cum)}${fmt(trial.cum)} บาท`;
  else msg=`บันทึก${TYPES[e.type]} ${fmt(e.amount)} บาทแล้ว`;
  ['t-qty','t-price','t-amount','t-note'].forEach(id=>{const el=document.getElementById(id); if(el) el.value='';});
  markDirty();
});

let pendingImport=null;
function backupFile(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`portfolio-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  msg='สร้างไฟล์สำรองแล้ว ดูในโฟลเดอร์ดาวน์โหลด'; msgErr=false; render();
}
function stageImport(text){
  let d=null; try{ d=JSON.parse(text); }catch(e){}
  if(d && d.state) d=d.state;
  if(d && !d.v && d.holdings) d=migrate(d);
  if(!d || d.v!==2 || !d.opening || !Array.isArray(d.entries)){ msg='อ่านข้อมูลไม่ได้ ตรวจว่าเป็นไฟล์สำรองจากแอปนี้'; msgErr=true; render(); return; }
  pendingImport=d; document.getElementById('bk-confirm').hidden=false;
}
document.addEventListener('change', e=>{ if(e.target.id==='bk-file' && e.target.files[0]){ const f=e.target.files[0]; f.text().then(stageImport); e.target.value=''; } });
window.__portfolioTest = {replay:(st)=>{ const keep=S; S=st; try{ return replay(st.entries); } finally { S=keep; } }, monthly, stats};
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
</body>
</html>
